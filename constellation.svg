    <!-- Glows layer -->
    <g>
      <!-- Glow for point 0 -->
      <circle cx="64.5" cy="133.9" r="26.3" fill="#58a6ff" opacity="0.04" filter="url(#glow)">
        <animate attributeName="opacity" values="0.04;0.10;0.04" dur="9.6s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </circle>
      <circle cx="64.5" cy="133.9" r="13.2" fill="#58a6ff" opacity="0.12" filter="url(#glow)">
