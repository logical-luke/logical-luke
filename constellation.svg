    <!-- Glows layer -->
    <g>
      <!-- Glow for point 0 -->
      <circle cx="41.9" cy="121.4" r="23.4" fill="#58a6ff" opacity="0.04" filter="url(#glow)">
        <animate attributeName="opacity" values="0.04;0.10;0.04" dur="7.7s" begin="3.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
