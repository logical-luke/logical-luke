        <animate attributeName="opacity" values="0.76;0.27;0.76" dur="10.8s" begin="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </circle>
